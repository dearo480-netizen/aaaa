<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f1e7">
  <meta name="description" content="KOSSAM 수업용 네오브루탈리즘 타이머">
  <title>KOSSAM — CLASS TIMER</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{font-family:'Space Grotesk','Arial',sans-serif;color:#171714;background:#f5f1e7;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;--ink:#171714;--paper:#f5f1e7;--lime:#d5fb39;--orange:#ff653b;--line:rgba(23,23,20,.2)}
*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh}button{font:inherit;color:inherit}.app{position:relative;min-height:100vh;overflow:hidden;padding:0 6.2vw;display:flex;flex-direction:column;background-color:var(--paper);isolation:isolate}.grain{position:absolute;inset:0;z-index:-1;opacity:.14;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.26'/%3E%3C/svg%3E")}.topbar{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:22px 'Archivo Black',sans-serif;letter-spacing:-1px}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border:2px solid var(--ink);background:var(--lime);box-shadow:3px 3px 0 var(--ink);font-size:17px}.brand-dot{color:var(--orange)}.top-meta,.sound-toggle,.eyebrow,.side-note,.timer-card-top,.time-caption,.time-unit,.timer-card-bottom,.duration-heading,.preset small,.custom-controls,.helper-text,.footer{font-family:'DM Mono',monospace}.top-meta{font-size:10px;letter-spacing:1px;display:flex;align-items:center;gap:9px}.live-dot,.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#53ba54;box-shadow:0 0 0 3px #53ba5422}.meta-divider{opacity:.4}.sound-toggle{height:34px;border:1.5px solid var(--ink);background:transparent;padding:0 10px;display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.6px;cursor:pointer;transition:background .2s,transform .2s}.sound-toggle:hover{background:var(--lime);transform:translateY(-2px)}.sound-icon{font-size:17px}.hero{width:min(100%,1000px);margin:0 auto;flex:1;display:flex;flex-direction:column;align-items:center}.eyebrow{margin-top:45px;display:flex;align-items:center;gap:12px;font-size:9px;letter-spacing:2px}.eyebrow-line{width:28px;height:1px;background:var(--ink);opacity:.5}h1{font:clamp(56px,8.1vw,106px)/.84 'Archivo Black',Impact,sans-serif;letter-spacing:-.065em;text-align:center;margin:21px 0 12px;position:relative}h1 span{color:var(--orange);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}.mobile-break{display:none}.subtitle{font-size:13px;margin:8px 0 0;color:#55554e}.timer-layout{width:min(100%,780px);display:grid;grid-template-columns:1fr 430px 1fr;align-items:center;gap:20px;margin:26px auto 0}.side-note{font-size:9px;line-height:1.6;letter-spacing:1.2px;display:flex;flex-direction:column;gap:10px;opacity:.72}.left-note{align-items:flex-end;text-align:right}.right-note{align-items:flex-start}.note-index{font-size:8px;background:var(--lime);border:1px solid var(--ink);padding:2px 5px}.note-rule{height:1px;width:36px;background:var(--ink);margin-top:3px}.timer-stage{position:relative}.timer-card{background:var(--lime);border:2px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:14px 20px 12px;transition:transform .25s,box-shadow .25s;position:relative;z-index:1}.timer-card.is-running{animation:cardPulse 3s ease-in-out infinite}.timer-card.is-done{background:#ffb84a;animation:finishPop .5s cubic-bezier(.2,1.5,.5,1)}@keyframes cardPulse{0%,100%{box-shadow:8px 8px 0 var(--ink)}50%{box-shadow:8px 8px 0 var(--ink),0 0 0 5px #d5fb3980}}@keyframes finishPop{50%{transform:scale(1.035) rotate(-1deg)}}.timer-card-top,.timer-card-bottom{display:flex;align-items:center;justify-content:space-between;font-size:8px;letter-spacing:1px}.status-label{display:flex;align-items:center;gap:7px}.status-dot{width:6px;height:6px;background:var(--ink);box-shadow:none}.is-running .status-dot{animation:blink 1s steps(2,start) infinite}@keyframes blink{to{opacity:.2}}.timer-tag{font-size:8px;opacity:.6}.dial-wrap{width:270px;height:270px;margin:4px auto 0;position:relative;display:grid;place-items:center}.dial{width:100%;height:100%;overflow:visible;transform:rotate(-90deg)}.dial-track{fill:none;stroke:rgba(23,23,20,.14);stroke-width:2}.dial-progress{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .7s linear}.dial-orbit{fill:none;stroke:rgba(23,23,20,.22);stroke-width:1;stroke-dasharray:2 7}.time-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center}.time-caption{font-size:8px;letter-spacing:2px;margin-bottom:8px}.time-display{font:clamp(68px,8vw,92px)/.95 'Archivo Black',monospace;letter-spacing:-.085em;font-variant-numeric:tabular-nums}.time-unit{font-size:8px;letter-spacing:2px;margin-top:7px}.time-unit span{padding:0 7px;opacity:.45}.dial-tick{position:absolute;width:2px;height:8px;background:var(--ink);left:calc(50% - 1px)}.tick-top{top:1px}.tick-bottom{bottom:1px}.timer-controls{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 10px}.reset-btn{width:43px;height:43px;border:1.5px solid var(--ink);background:transparent;font-size:27px;line-height:1;cursor:pointer;transition:transform .3s,background .2s}.reset-btn:hover{transform:rotate(-45deg);background:#fff8}.start-btn{height:43px;min-width:176px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 14px;font:11px 'DM Mono',monospace;letter-spacing:1.2px;cursor:pointer;transition:background .2s,color .2s,transform .2s;box-shadow:3px 3px 0 #ffffff90}.start-btn:hover{background:var(--paper);color:var(--ink);transform:translate(-1px,-1px)}.play-symbol{font-size:12px}.button-arrow{font-size:17px}.control-spacer{width:43px}.timer-card-bottom{padding-top:10px;border-top:1px solid rgba(23,23,20,.25);font-size:7px;letter-spacing:.7px;opacity:.75}.sticker{position:absolute;z-index:2}.sticker-spark{right:-34px;top:24px;font-size:36px;color:var(--orange);-webkit-text-stroke:1px var(--ink);animation:spin 12s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.sticker-note{left:-37px;bottom:62px;background:var(--orange);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:8px/1.3 'DM Mono',monospace;padding:8px 7px;transform:rotate(-8deg)}.duration-panel{width:min(100%,590px);margin:23px auto 28px}.duration-heading{display:flex;align-items:center;gap:10px;font-size:9px;letter-spacing:1.2px;margin-bottom:10px}.duration-heading>span:first-child{background:var(--ink);color:var(--paper);padding:3px 5px}.heading-rule{height:1px;background:var(--line);flex:1}.preset-row{display:grid;grid-template-columns:repeat(8,1fr) auto;gap:6px}.preset{height:49px;border:1.3px solid var(--ink);background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s}.preset:hover{transform:translateY(-3px);box-shadow:2px 3px 0 var(--ink)}.preset.selected{background:var(--orange);box-shadow:2px 3px 0 var(--ink);transform:translateY(-2px)}.preset span{font:17px 'Archivo Black',sans-serif;letter-spacing:-1px}.preset small{font-size:7px;letter-spacing:1px}.custom-controls{border:1px solid var(--ink);height:49px;display:flex;align-items:center;gap:5px;padding:0 5px;font-size:7px;letter-spacing:.6px}.custom-controls button{border:0;background:transparent;font-size:17px;width:21px;height:27px;cursor:pointer}.custom-controls button:hover{background:var(--lime)}.helper-text{text-align:center;font-size:8px;letter-spacing:1.5px;margin:12px 0 0;opacity:.65}.helper-text span{color:var(--orange);font-size:13px}.footer{min-height:45px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:8px;letter-spacing:1px;opacity:.7}.footer-stamp{font:12px 'Archivo Black',sans-serif;letter-spacing:-.5px;opacity:1}.footer-stamp b{color:var(--orange)}.finish-banner{position:fixed;z-index:10;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;display:flex;align-items:center;gap:10px;box-shadow:5px 5px 0 var(--orange);font-size:13px;white-space:nowrap;animation:bannerIn .45s cubic-bezier(.2,1.3,.5,1)}.finish-banner>span{color:var(--lime);font-size:20px;animation:spin 4s linear infinite}.finish-banner button{background:var(--lime);border:1px solid var(--paper);padding:6px 9px;font:10px 'DM Mono',monospace;cursor:pointer}@keyframes bannerIn{from{opacity:0;transform:translate(-50%,30px) scale(.8)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
/* A burst is drawn in CSS so the celebration works without image assets. */
.fireworks{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}.burst{position:absolute;left:var(--x);top:var(--y);width:1px;height:1px;animation:burstFade 1.45s ease-out both;animation-delay:var(--delay)}.burst i{position:absolute;left:0;top:0;width:var(--w);height:var(--h);border-radius:2px;background:var(--c);transform:rotate(var(--rot));animation:firework 1.25s cubic-bezier(.1,.65,.25,1) both;animation-delay:var(--delay);box-shadow:0 0 5px #fff8}.burst i:nth-child(odd){border-radius:50%}.burst i:nth-child(3n){width:4px;height:4px}@keyframes firework{0%{transform:translate(0,0) scale(.25) rotate(0);opacity:1}78%{opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(.8) rotate(500deg);opacity:0}}@keyframes burstFade{0%,85%{opacity:1}100%{opacity:0}}.is-finished .timer-card{z-index:9}
@media(max-width:760px){.app{padding:0 5vw}.topbar{height:63px}.brand{font-size:19px}.top-meta{font-size:8px;gap:6px}.sound-label{display:none}.sound-toggle{width:35px;justify-content:center}.eyebrow{margin-top:32px}h1{font-size:clamp(55px,12vw,86px);margin-top:18px}.subtitle{font-size:12px}.timer-layout{grid-template-columns:1fr;gap:0;width:min(100%,420px);margin-top:18px}.side-note{display:none}.timer-card{padding:12px 17px 11px}.dial-wrap{width:min(68vw,260px);height:min(68vw,260px);margin:3px auto 0}.time-display{font-size:clamp(72px,17vw,90px)}.sticker-spark{right:-16px;top:15px;font-size:29px}.sticker-note{left:-13px;bottom:59px;font-size:7px}.duration-panel{margin:22px auto 20px}.preset-row{grid-template-columns:repeat(4,1fr) auto}.preset{height:43px}.custom-controls{grid-column:5;grid-row:1 / span 2;height:auto;flex-direction:column;justify-content:space-around;padding:4px}.helper-text{margin-top:9px}.footer{font-size:7px;min-height:40px}.footer-stamp{font-size:10px}}
@media(max-width:430px){.top-meta{letter-spacing:.4px}.live-dot{width:6px;height:6px}.meta-divider{display:none}.eyebrow{margin-top:26px}h1{font-size:58px}.mobile-break{display:block}.subtitle{margin-top:6px}.timer-layout{margin-top:18px}.dial-wrap{width:235px;height:235px}.time-display{font-size:77px}.timer-card{box-shadow:6px 6px 0 var(--ink)}.sticker-note{left:-8px;bottom:55px}.preset-row{gap:5px}.footer>span:first-child{max-width:75px;line-height:1.4}.footer>span:last-child{max-width:93px;text-align:right;line-height:1.4}.finish-banner{bottom:12px;font-size:11px;padding:10px;gap:7px}.finish-banner button{font-size:9px;padding:5px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="env,react">
const { useEffect, useRef, useState } = React;

const PRESETS = [5, 10, 15, 20, 25, 30, 45, 60];
const INITIAL_SECONDS = 25 * 60;

function App() {
  const [duration, setDuration] = useState(INITIAL_SECONDS);
  const [remaining, setRemaining] = useState(INITIAL_SECONDS);
  const [running, setRunning] = useState(false);
  const [finished, setFinished] = useState(false);
  const [soundOn, setSoundOn] = useState(true);
  const [now, setNow] = useState(new Date());
  const audioRef = useRef(null);

  useEffect(() => {
    const clock = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(clock);
  }, []);

  useEffect(() => {
    if (!running) return undefined;
    const id = setInterval(() => {
      setRemaining(value => {
        if (value <= 1) {
          clearInterval(id);
          setRunning(false);
          setFinished(true);
          return 0;
        }
        return value - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [running]);

  useEffect(() => {
    if (finished && soundOn) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioRef.current = audioRef.current || new AudioContext();
        const ctx = audioRef.current;
        [0, 0.22, 0.44].forEach((delay, i) => {
          const oscillator = ctx.createOscillator();
          const gain = ctx.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.value = [660, 880, 660][i];
          gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime + delay + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.28);
          oscillator.connect(gain); gain.connect(ctx.destination);
          oscillator.start(ctx.currentTime + delay); oscillator.stop(ctx.currentTime + delay + 0.3);
        });
      } catch { /* Audio is optional; the visual alert remains. */ }
    }
  }, [finished, soundOn]);

  const chooseDuration = minutes => {
    const seconds = minutes * 60;
    setDuration(seconds); setRemaining(seconds); setRunning(false); setFinished(false);
  };
  const toggleTimer = () => {
    if (remaining === 0) { setRemaining(duration); setFinished(false); setRunning(true); }
    else { setFinished(false); setRunning(value => !value); }
  };
  const resetTimer = () => { setRunning(false); setFinished(false); setRemaining(duration); };
  const adjustDuration = delta => {
    const next = Math.min(120, Math.max(1, Math.round(duration / 60) + delta)) * 60;
    setDuration(next); setRemaining(next); setRunning(false); setFinished(false);
  };
  const format = seconds => `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
  const progress = duration ? (duration - remaining) / duration : 0;
  const circumference = 2 * Math.PI * 134;
  const fireworks = finished ? Array.from({ length: 7 }, (_, burst) => ({
    id: burst, x: `${9 + (burst * 37) % 84}%`, y: `${13 + (burst * 29) % 65}%`,
    delay: `${burst * 0.12}s`, particles: Array.from({ length: 22 }, (_, particle) => {
      const angle = (particle / 22) * Math.PI * 2 + burst * 0.23;
      const distance = 55 + ((particle * 31 + burst * 17) % 100);
      return { id: particle, tx: `${Math.cos(angle) * distance}px`, ty: `${Math.sin(angle) * distance}px`, color: ['#d5fb39', '#ff653b', '#ffffff', '#4ac6e8', '#f2cf4a'][(particle + burst) % 5], rotation: `${(particle * 43) % 360}deg`, size: `${4 + (particle % 3)}px` };
    })
  })) : []; 
  const clock = new Intl.DateTimeFormat('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }).format(now);

  return (
    <main className={`app ${finished ? 'is-finished' : ''}`}>
      <div className="grain" aria-hidden="true" />
      <header className="topbar">
        <a className="brand" href="#timer" aria-label="KOSSAM timer home"><span className="brand-mark">K</span><span>KOSSAM<span className="brand-dot">.</span></span></a>
        <div className="top-meta"><span className="live-dot" /> CLASSROOM TOOL <span className="meta-divider">/</span> {clock}</div>
        <button className={`sound-toggle ${soundOn ? 'on' : ''}`} onClick={() => setSoundOn(v => !v)} aria-label={soundOn ? '알림음 끄기' : '알림음 켜기'} title={soundOn ? '알림음 켜기' : '알림음 끄기'}>
          <span className="sound-icon">{soundOn ? '♪' : '×'}</span><span className="sound-label">SOUND {soundOn ? 'ON' : 'OFF'}</span>
        </button>
      </header>

      <section className="hero" id="timer">
        <div className="eyebrow"><span className="eyebrow-line" /> FOCUS MODE <span className="eyebrow-line" /></div>
        <h1>TIME TO<br className="mobile-break" /> <span>MAKE IT.</span></h1>
        <p className="subtitle">수업에 집중하는 시간, 지금 시작해요.</p>

        <div className="timer-layout">
          <div className="side-note left-note"><span className="note-index">01</span><span>SET YOUR<br/>PACE</span><span className="note-rule" /></div>
          <div className="timer-stage">
            <div className={`timer-card ${running ? 'is-running' : ''} ${finished ? 'is-done' : ''}`}>
              <div className="timer-card-top"><span className="status-label"><span className="status-dot" />{finished ? 'TIME’S UP' : running ? 'IN SESSION' : 'READY WHEN YOU ARE'}</span><span className="timer-tag">K—01</span></div>
              <div className="dial-wrap">
                <svg className="dial" viewBox="0 0 300 300" aria-hidden="true">
                  <circle className="dial-track" cx="150" cy="150" r="134" />
                  <circle className="dial-progress" cx="150" cy="150" r="134" strokeDasharray={circumference} strokeDashoffset={circumference * (1 - progress)} />
                  <circle className="dial-orbit" cx="150" cy="150" r="145" />
                </svg>
                <div className="time-content" aria-live="polite" aria-atomic="true">
                  <span className="time-caption">{finished ? 'GREAT WORK' : 'TIME LEFT'}</span>
                  <div className="time-display">{format(remaining)}</div>
                  <span className="time-unit">MIN <span>:</span> SEC</span>
                </div>
                <span className="dial-tick tick-top"/><span className="dial-tick tick-bottom"/>
              </div>
              <div className="timer-controls">
                <button className="reset-btn" onClick={resetTimer} aria-label="타이머 초기화" title="초기화"><span>↺</span></button>
                <button className="start-btn" onClick={toggleTimer}>
                  <span className="play-symbol">{running ? 'Ⅱ' : remaining === 0 ? '↻' : '▶'}</span>
                  <span>{running ? 'PAUSE' : remaining === 0 ? 'RESTART' : 'START'}</span>
                  <span className="button-arrow">↗</span>
                </button>
                <span className="control-spacer" />
              </div>
              <div className="timer-card-bottom"><span>FOCUS IS A SUPERPOWER.</span><span>✳ 01 / 01</span></div>
            </div>
            <span className="sticker sticker-spark">✳</span>
            <span className="sticker sticker-note">LESS<br/>SCROLL,<br/>MORE SOUL.</span>
          </div>
          <div className="side-note right-note"><span className="note-index">02</span><span>STAY IN<br/>THE ZONE</span><span className="note-rule" /></div>
        </div>

        <div className="duration-panel">
          <div className="duration-heading"><span>01</span><span>CHOOSE DURATION</span><span className="heading-rule" /></div>
          <div className="preset-row">
            {PRESETS.map(min => <button key={min} className={`preset ${duration === min * 60 ? 'selected' : ''}`} onClick={() => chooseDuration(min)} aria-pressed={duration === min * 60}><span>{String(min).padStart(2, '0')}</span><small>MIN</small></button>)}
            <div className="custom-controls"><button onClick={() => adjustDuration(-1)} aria-label="1분 줄이기">−</button><span>CUSTOM</span><button onClick={() => adjustDuration(1)} aria-label="1분 늘리기">+</button></div>
          </div>
          <p className="helper-text">PICK A TIME. MAKE IT COUNT. <span>↗</span></p>
        </div>
      </section>

      <footer className="footer"><span>DESIGNED FOR BETTER CLASSROOMS</span><span className="footer-stamp">KOSSAM <b>✳</b> TIMER</span><span>TAKE A BREATH. THEN BEGIN AGAIN.</span></footer>
      {finished && <div className="fireworks" aria-hidden="true">{fireworks.map(burst => <div key={burst.id} className="burst" style={{ '--x': burst.x, '--y': burst.y, '--delay': burst.delay }}>{burst.particles.map(p => <i key={p.id} style={{ '--tx': p.tx, '--ty': p.ty, '--c': p.color, '--rot': p.rotation, '--w': p.size, '--h': p.size }} />)}</div>)}</div>}
      {finished && <div className="finish-banner" role="status"><span>✳</span> 수업 시간이 끝났어요! 수고했어요. <button onClick={resetTimer}>다시 시작 ↗</button></div>}
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
